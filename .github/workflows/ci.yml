name: CI

# Renders example_CV.yaml through the reusable workflow. The workflow loads the
# scripts from its own commit, so every change is tested end to end.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  example:
    uses: ./.github/workflows/build-resume.yml
    with:
      cv_file: example_CV.yaml
      commit_output: false
