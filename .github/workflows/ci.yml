name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Lint workflows
        # Older actionlint releases don't know the job.workflow_* context yet.
        run: |
          bash <(curl -sSfL https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash)
          ./actionlint -color -ignore 'property "workflow_(repository|sha)" is not defined'

      - name: Check module layout
        run: |
          status=0
          for dir in .github/actions/*/; do
            for file in action.yml README.md; do
              if [ ! -f "$dir$file" ]; then
                echo "::error file=$dir::Module $dir is missing $file"
                status=1
              fi
            done
          done
          exit $status

      - name: Compile Python
        run: python3 -m py_compile .github/actions/*/*.py docs/module-template/*.py

  # Renders example_CV.yaml through the real reusable workflow. It loads the
  # modules from its own commit, so every change is tested end to end.
  example:
    needs: lint
    uses: ./.github/workflows/build-resume.yml
    with:
      cv_file: example_CV.yaml
      commit_output: false
