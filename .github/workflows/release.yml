name: Release

# Publish a release in either of two ways:
#   - Actions → Release → Run workflow, and enter a version like v1.2.0
#     (the workflow creates the tag on the selected branch's latest commit), or
#   - push a tag yourself: git tag v1.2.0 && git push origin v1.2.0
#
# The workflow renders example_CV.yaml with that exact version, publishes a
# GitHub release whose notes come from that version's CHANGELOG.md section,
# attaches the sample PDF, refreshes the README preview image
# (docs/sample-resume.png) on the default branch, and moves the major tag (v1)
# so callers pinned to @v1 pick up the new version. Pre-release versions
# (v1.2.0-rc.1) are published as pre-releases and leave the major tag alone.

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      version:
        description: Version to release, e.g. v1.2.0
        type: string
        required: true

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  tag:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Resolve and create tag
        id: tag
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            TAG="$INPUT_VERSION"
          else
            TAG="$GITHUB_REF_NAME"
          fi
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::'$TAG' is not a version like v1.2.0 or v1.2.0-rc.1"
            exit 1
          fi
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
              echo "::error::Tag $TAG already exists"
              exit 1
            fi
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "$TAG" -m "$TAG" "$GITHUB_SHA"
            git push origin "refs/tags/$TAG"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

  sample:
    needs: tag
    uses: ./.github/workflows/build-resume.yml
    with:
      cv_file: example_CV.yaml
      commit_output: false
      artifact_name: sample-resume

  release:
    needs: [tag, sample]
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ needs.tag.outputs.tag }}
    steps:
      - name: Checkout default branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Download sample resume
        uses: actions/download-artifact@v8
        with:
          name: sample-resume
          path: sample

      - name: Name release asset
        run: |
          mkdir assets
          cp sample/*.pdf assets/sample-resume.pdf
          ls -l assets

      - name: Create GitHub release
        run: |
          # Notes come from this version's section in CHANGELOG.md. Without
          # one, fall back to GitHub's generated list of commits.
          notes_flags=()
          if python3 .github/scripts/release_notes.py "$TAG" > notes.md; then
            notes_flags+=(--notes-file notes.md)
          else
            echo "::warning::CHANGELOG.md has no section for $TAG; using generated notes"
            notes_flags+=(--generate-notes)
          fi

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; refreshing its notes and asset."
            gh release upload "$TAG" assets/sample-resume.pdf --clobber
            [ -s notes.md ] && gh release edit "$TAG" --notes-file notes.md
            exit 0
          fi

          flags=()
          [[ "$TAG" == *-* ]] && flags+=(--prerelease)

          gh release create "$TAG" assets/sample-resume.pdf \
            --title "$TAG" \
            --verify-tag \
            "${notes_flags[@]}" \
            "${flags[@]}"

      - name: Refresh README preview
        if: ${{ !contains(needs.tag.outputs.tag, '-') }}
        run: |
          cp "$(find sample -maxdepth 1 -name '*.png' | sort | head -n 1)" docs/sample-resume.png
          git add docs/sample-resume.png
          if git diff --staged --quiet; then
            echo "Preview unchanged."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "docs: refresh sample preview for $TAG"
            git push origin "HEAD:${{ github.event.repository.default_branch }}"
          fi

      - name: Move major version tag
        if: ${{ !contains(needs.tag.outputs.tag, '-') }}
        run: |
          MAJOR="${TAG%%.*}"
          git fetch -q origin "refs/tags/$TAG:refs/tags/$TAG"
          git tag -f "$MAJOR" "$TAG^{commit}"
          git push -f origin "refs/tags/$MAJOR"
          echo "Moved $MAJOR to $TAG"
