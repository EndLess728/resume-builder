# yaml-language-server: $schema=https://raw.githubusercontent.com/rendercv/rendercv/refs/tags/v2.6/schema.json
#
# Example CV for the resume toolkit. Everything here is made up.
# Copy this file into your own (private) repo, rename it, and replace the content.
# Full field reference: https://docs.rendercv.com/
cv:
  name: Alex Rivera
  headline: Senior Mobile Engineer
  location: London, UK
  phone: +44 20 7946 0958  # Ofcom drama range, reserved for fiction
  email: alex.rivera@example.com
  website: https://example.com/
  social_networks:
    - network: GitHub
      username: example
  custom_connections:
    - placeholder: LinkedIn
      url: https://www.linkedin.com/in/example/
      fontawesome_icon: linkedin
  sections:
    profile_summary:
      - Mobile engineer with 6 years building cross-platform apps in React Native and Expo, with a focus on performance, native modules and reliable release pipelines.
    skills:
      - label: Languages
        details: TypeScript, JavaScript, Swift, Kotlin
      - label: Mobile
        details: React Native, Expo, Expo Router, EAS Build, Native Modules
      - label: Tooling
        details: Jest, Detox, GitHub Actions, Firebase
    experience:
      - company: Example Corp
        position: Senior Mobile Engineer
        start_date: 2022-03
        end_date: present
        location: London, UK
        highlights:
          - Led a team of 5 engineers shipping a React Native app to 200K+ monthly users
          - Cut cold-start time by 30% by moving to the New Architecture and lazy-loading screens
          - Automated iOS and Android releases with EAS Build and GitHub Actions
      - company: Sample Studio
        position: Mobile Developer
        start_date: 2019-06
        end_date: 2022-02
        location: Austin, TX
        highlights:
          - Built 3 client apps from scratch in React Native, from design hand-off to store release
          - Wrote Swift and Kotlin modules for background location and push notifications
    open_source:
      # Entries whose name links to an npm package page get a live download
      # count appended to their summary by scripts/update_npm_stats.py.
      - name: "[left-pad](https://www.npmjs.com/package/left-pad)"
        summary: String left pad, used here only to demo the npm download counter
        highlights:
          - Replace this with your own package
    education:
      - institution: State University
        area: Computer Science
        degree: BSc
        end_date: 2019-05
design:
  theme: engineeringresumes
  templates:
    top_note: "*LAST_UPDATED MONTH_ABBREVIATION DAY, YEAR*"
  typography:
    line_spacing: 0.4em
locale:
  language: english
  last_updated: Last updated on
settings:
  render_command:
    typst_path: rendercv_output/NAME_IN_SNAKE_CASE_CV.typ
    pdf_path: rendercv_output/NAME_IN_SNAKE_CASE_CV.pdf
    markdown_path: rendercv_output/NAME_IN_SNAKE_CASE_CV.md
    html_path: rendercv_output/NAME_IN_SNAKE_CASE_CV.html
    png_path: rendercv_output/NAME_IN_SNAKE_CASE_CV.png
    dont_generate_markdown: true
    dont_generate_html: true
    dont_generate_typst: false
    dont_generate_pdf: false
    dont_generate_png: false
